<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoH Macro Players</title>
<style>
  :root { --bg: #0d0f12; --text: #e8e6e1; --muted: #9a9890; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  p { color: var(--muted); }
  soh-player { margin: 16px 0 32px; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Macro players</h1>
  <p>Tries <code>&lt;soh-player&gt;</code> with player files (JSON naming a gz savestate and macro, see
    soh-player.js) from this server. List them in the URL, one <code>p</code> per player:
    <code>?p=trick.json,Caption&amp;p=…</code>.
    For local testing, <code>&amp;archive=oot.o2r</code> fetches the game archive from this server.</p>
  <div id="players"></div>
</main>
<script src="soh-runtime.js"></script>
<script src="soh-player.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  // The first load decides the options, so this runs before any player loads the game
  SohRuntime.load({ input: false, archiveUrl: params.get("archive") });
  for (const entry of params.getAll("p")) {
    const [src, ...caption] = entry.split(",");
    const player = document.createElement("soh-player");
    player.setAttribute("src", src);
    player.textContent = caption.join(",") || src;
    document.getElementById("players").append(player);
  }
</script>
</body>
</html>
