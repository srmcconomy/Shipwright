<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship of Harkinian</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #171a20;
    --text: #e8e6e1;
    --muted: #9a9890;
    --accent: #e0b34a;
    --danger: #e06c5a;
    --border: #2a2e36;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; background: #000; }
  #launcher { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--bg); z-index: 1; }
  .panel { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .row:last-of-type { border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .label { font-weight: 600; }
  .status { color: var(--muted); font-size: 13px; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--danger); }
  label.btn, button { font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--border); background: transparent; color: var(--text); white-space: nowrap; }
  label.btn input { display: none; }
  #play { width: 100%; padding: 12px; font-weight: 600; background: var(--accent); color: #1a1406; border: none; }
  #play:disabled { opacity: .4; cursor: default; }
  .links { margin-top: 14px; display: flex; justify-content: space-between; font-size: 13px; }
  .links button { border: none; padding: 0; color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="launcher">
  <div class="panel">
    <h1>Ship of Harkinian</h1>
    <p>Pick the <code>oot.o2r</code> (or <code>oot-mq.o2r</code>) that the desktop version made from your ROM. It is kept in this browser, so you only do this once.</p>

    <div class="row">
      <div><div class="label">Game archive</div><div class="status" id="rom-status">Checking…</div></div>
      <label class="btn">Choose…<input type="file" id="rom-input" accept=".o2r,.otr"></label>
    </div>
    <div class="row">
      <div><div class="label">Mods</div><div class="status" id="mods-status">None</div></div>
      <label class="btn">Add…<input type="file" id="mods-input" accept=".o2r,.otr,.zip" multiple></label>
    </div>

    <button id="play" disabled>Play</button>
    <div class="links">
      <button id="export">Download saves</button>
      <button id="reset">Forget all data</button>
    </div>
  </div>
</div>

<script>
  // The game reads and writes everything under /ship, which lives in IndexedDB.
  const HOME = "/ship";
  const romStatus = document.getElementById("rom-status");
  const modsStatus = document.getElementById("mods-status");
  const playButton = document.getElementById("play");
  let started = false;

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = "status" + (kind ? " " + kind : "");
  }

  function exists(path) {
    try { FS.stat(path); return true; } catch (e) { return false; }
  }

  function syncToDisk() {
    return new Promise((resolve) => FS.syncfs(false, (err) => {
      if (err) console.error("Saving to IndexedDB failed", err);
      resolve();
    }));
  }

  function refreshLauncher() {
    const archives = ["oot.o2r", "oot-mq.o2r"].filter((f) => exists(HOME + "/" + f));
    if (archives.length) {
      setStatus(romStatus, archives.join(", ") + " ready", "ok");
    } else {
      setStatus(romStatus, "Not loaded yet");
    }
    const mods = FS.readdir(HOME + "/mods").filter((f) => f !== "." && f !== "..");
    setStatus(modsStatus, mods.length ? mods.join(", ") : "None", mods.length ? "ok" : "");
    playButton.disabled = archives.length === 0;
  }

  async function writeUploads(files, dir, nameFor) {
    for (const file of files) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      FS.writeFile(dir + "/" + nameFor(file), bytes);
    }
    await syncToDisk();
    refreshLauncher();
  }

  document.getElementById("rom-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setStatus(romStatus, "Loading " + file.name + "…");
    // The desktop version names Master Quest archives oot-mq.o2r
    const name = /mq/i.test(file.name) ? "oot-mq.o2r" : "oot.o2r";
    await writeUploads([file], HOME, () => name);
  });

  document.getElementById("mods-input").addEventListener("change", async (e) => {
    setStatus(modsStatus, "Loading…");
    await writeUploads(e.target.files, HOME + "/mods", (f) => f.name);
  });

  document.getElementById("reset").addEventListener("click", async () => {
    if (!confirm("Delete the game archive, mods, saves and settings stored in this browser?")) return;
    indexedDB.deleteDatabase(HOME);
    location.reload();
  });

  document.getElementById("export").addEventListener("click", () => {
    const dir = HOME + "/Save";
    if (!exists(dir)) { alert("No saves yet."); return; }
    for (const name of FS.readdir(dir)) {
      if (name === "." || name === "..") continue;
      const blob = new Blob([FS.readFile(dir + "/" + name)]);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  });

  // Files dropped on the page, or picked from the game's own Browse buttons, are copied into
  // /ship/dropped and handed to the game like a desktop drag-and-drop (gz macros, savestates...).
  // They live in IndexedDB too, so a path the game remembers still loads after a reload.
  let running = false;
  window.SohWeb = {
    async importFile(file) {
      if (!running) return;
      const dir = HOME + "/dropped";
      if (!exists(dir)) FS.mkdir(dir);
      const path = dir + "/" + file.name.replace(/[\\/]/g, "_");
      FS.writeFile(path, new Uint8Array(await file.arrayBuffer()));
      await syncToDisk();
      Module.ccall("SohWeb_FileDropped", null, ["string"], [path]);
    },
  };

  // Always cancel the browser's default, which would navigate away from the game to the file
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    for (const file of e.dataTransfer.files) {
      await SohWeb.importFile(file);
    }
  });

  playButton.addEventListener("click", async () => {
    if (started) return;
    started = true;
    playButton.disabled = true;
    playButton.textContent = "Loading…";
    try {
      // soh.o2r ships with this build, so always take the copy next to the page
      const response = await fetch("soh.o2r");
      if (!response.ok) throw new Error("soh.o2r is missing from the server (" + response.status + ")");
      FS.writeFile(HOME + "/soh.o2r", new Uint8Array(await response.arrayBuffer()));
    } catch (err) {
      alert(err.message);
      started = false;
      playButton.disabled = false;
      playButton.textContent = "Play";
      return;
    }
    document.getElementById("launcher").remove();
    const canvas = document.getElementById("canvas");
    canvas.focus();

    // Saves and settings are written to the in-memory filesystem; copy them to IndexedDB often
    setInterval(syncToDisk, 5000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) syncToDisk(); });
    window.addEventListener("pagehide", syncToDisk);

    running = true;
    Module.callMain([]);
  });

  var Module = {
    canvas: document.getElementById("canvas"),
    print: (...args) => console.log(...args),
    printErr: (...args) => console.error(...args),
    preRun: [() => {
      FS.mkdir(HOME);
      FS.mount(IDBFS, { autoPersist: false }, HOME);
      addRunDependency("idbfs");
      FS.syncfs(true, (err) => {
        if (err) console.error("Loading from IndexedDB failed", err);
        if (!exists(HOME + "/mods")) FS.mkdir(HOME + "/mods");
        FS.chdir(HOME);
        removeRunDependency("idbfs");
      });
    }],
    onRuntimeInitialized: async () => {
      // For local testing: ?archive=oot.o2r fetches the archive from this server instead of
      // asking for a file. Never host a ROM archive publicly.
      const archive = new URLSearchParams(location.search).get("archive");
      if (archive && !exists(HOME + "/oot.o2r") && !exists(HOME + "/oot-mq.o2r")) {
        setStatus(romStatus, "Fetching " + archive + "…");
        const response = await fetch(archive);
        if (response.ok) {
          const name = /mq/i.test(archive) ? "oot-mq.o2r" : "oot.o2r";
          FS.writeFile(HOME + "/" + name, new Uint8Array(await response.arrayBuffer()));
          await syncToDisk();
        }
      }
      refreshLauncher();
    },
    onAbort: (what) => alert("The game stopped: " + what),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
